name: CI

on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          pnpm install

      - name: Lint frontend
        working-directory: frontend
        run: |
          pnpm run lint

      - name: Type Check frontend
        working-directory: frontend
        run: |
          pnpm run type-check

      - name: Tests frontend
        working-directory: frontend
        run: |
          pnpm run test

  deploy:
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy Frontend to Render
        run: |
          curl "$RENDER_DEPLOY_FRONTEND"
        env:
          RENDER_DEPLOY_FRONTEND: ${{ secrets.RENDER_DEPLOY_FRONTEND }}